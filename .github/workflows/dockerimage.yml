name: docker image

on:
  push:
    paths:
      - debian/changelog

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      new-version: ${{ steps.version.outputs.new-version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare debian/changelog version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          version() { sed -n '1s/.*(\(.*\)).*/\1/p'; }
          NEW=$(version < debian/changelog)
          OLD=$(git show $BEFORE:debian/changelog 2>/dev/null | version)
          echo "previous: ${OLD:-none}, current: $NEW"
          if [ "$NEW" != "$OLD" ]; then
            echo "new-version=true" >> $GITHUB_OUTPUT
          fi

  push:
    needs: check
    if: needs.check.outputs.new-version == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --file docker/Dockerfile --tag image .

      - name: login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: push
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository }}/arco-authors
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          echo IMAGE_ID=$IMAGE_ID
          docker tag image $IMAGE_ID:latest
          docker push $IMAGE_ID:latest
